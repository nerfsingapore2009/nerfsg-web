<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG first: it is 512 bytes and stays sharp at every size. The webp is
         the wide wordmark, kept only as the fallback for browsers with no SVG
         icon support — it is 37 KB and the wrong aspect ratio for a tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/webp" href="/nerfsingapore.webp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e03131" />

    <title>NerfSG | Singapore Nerf Community</title>
    <meta name="description" content="Weekly foam dart games in Singapore, open to all skill levels. Bring a blaster or borrow one from us — find the next game and just turn up." />

    <!-- Homepage values. lib/usePageMeta.js rewrites the canonical, the
         description and og:url per route once React mounts — without that, this
         single canonical tells crawlers that all fourteen routes are the
         homepage. -->
    <link rel="canonical" href="https://nerfsg.com/" />

    <!-- Most visitors arrive from a link pasted into Telegram or Instagram, so
         the unfurled card is the genuine first impression. Static tags are
         enough here: this is a client-rendered SPA, so per-route meta would not
         be seen by the crawlers that build these previews anyway. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NerfSG" />
    <meta property="og:url" content="https://nerfsg.com/" />
    <meta property="og:title" content="NerfSG — Weekly foam dart games in Singapore" />
    <meta property="og:description" content="Open to all skill levels. Bring a blaster or borrow one from us. Find the next game and just turn up." />
    <meta property="og:image" content="https://nerfsg.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A NerfSG player grinning as they slide out from behind orange cover mid-game, darts scattered across the ground." />
    <meta property="og:locale" content="en_SG" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NerfSG — Weekly foam dart games in Singapore" />
    <meta name="twitter:description" content="Open to all skill levels. Bring a blaster or borrow one from us. Find the next game and just turn up." />
    <meta name="twitter:image" content="https://nerfsg.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
